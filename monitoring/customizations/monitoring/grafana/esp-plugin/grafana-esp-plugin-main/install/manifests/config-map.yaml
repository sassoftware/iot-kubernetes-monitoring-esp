apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ini
data:
  grafana-uaa.ini: |
    [server]
    domain = kc4-oracle.contour.espsc-kc5-m1.espstudio.sashq-d.openstack.sas.com
    root_url = https://kc4-oracle.contour.espsc-kc5-m1.espstudio.sashq-d.openstack.sas.com/grafana/
    serve_from_sub_path = true

    [plugins]
    allow_loading_unsigned_plugins = sasesp-plugin

    [feature_toggles]
    accessTokenExpirationCheck = true

    [security]
    disable_initial_admin_creation = false
    cookie_secure = true
    cookie_samesite = lax

    [users]
    auto_assign_org = true
    auto_assign_org_role = Admin

    [auth]
    disable_login_form = true
    signout_redirect_url = https://kc4-oracle.contour.espsc-kc5-m1.espstudio.sashq-d.openstack.sas.com/SASLogon/logout.do

    [auth.generic_oauth]
    use_refresh_token = true
    tls_skip_verify_insecure = true
    enabled = true
    name = OAuth
    use_pkce = true
    auto_login = true
    client_id = sv_client
    client_secret = `secret`
    scopes = * openid profile email
    email_attribute_path = email
    name_attribute_path = user_name
    login_attribute_path = user_name
    auth_url = https://kc4-oracle.contour.espsc-kc5-m1.espstudio.sashq-d.openstack.sas.com/SASLogon/oauth/authorize
    token_url = https://kc4-oracle.contour.espsc-kc5-m1.espstudio.sashq-d.openstack.sas.com/SASLogon/oauth/token
    api_url = https://kc4-oracle.contour.espsc-kc5-m1.espstudio.sashq-d.openstack.sas.com/SASLogon/userinfo
    allow_assign_grafana_admin = true
    role_attribute_path = contains(grafana_roles[*], 'grafana-admin') && 'GrafanaAdmin' || contains(grafana_roles[*], 'admin') && 'Admin' || contains(grafana_roles[*], 'editor') && 'Editor' || 'Viewer'

